[package]
name = "kuro-core"
version = "0.1.0"
edition = "2021"
authors = ["ayashiiiyo"]
description = "High-performance native core engine for Kuro Music Player"

[lib]
name = "kuro_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
