[package]
name = "kuro-core"
version = "0.1.0"
edition = "2021"
authors = ["ayashiiiyo"]
description = "High-performance native core engine for Kuro Music Player"

[lib]
name = "kuro_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
lazy_static = "1.4"
