name: Build and Release Kuro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed Kuro Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      KURO_KEYSTORE_BASE64: ${{ secrets.KURO_KEYSTORE_BASE64 }}
      KURO_STORE_PASSWORD: ${{ secrets.KURO_STORE_PASSWORD }}
      KURO_KEY_ALIAS: ${{ secrets.KURO_KEY_ALIAS }}
      KURO_KEY_PASSWORD: ${{ secrets.KURO_KEY_PASSWORD }}
      KURO_KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Validate signing secrets and decode keystore
        run: |
          test -n "$KURO_KEYSTORE_BASE64" || { echo "Missing KURO_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KURO_STORE_PASSWORD" || { echo "Missing KURO_STORE_PASSWORD secret"; exit 1; }
          test -n "$KURO_KEY_ALIAS" || { echo "Missing KURO_KEY_ALIAS secret"; exit 1; }
          test -n "$KURO_KEY_PASSWORD" || { echo "Missing KURO_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$KURO_KEYSTORE_BASE64" | base64 --decode > "$KURO_KEYSTORE_FILE"
          test -s "$KURO_KEYSTORE_FILE"

      - name: Set up Rust Toolchain and Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Kuro Native Core (Rust)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86_64
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o app/src/main/jniLibs build --release --manifest-path kuro-core/Cargo.toml

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace || (echo "=== GRADLE BUILD FAILED ===" && exit 1)

      - name: Name APKs with app version
        id: apk
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION_NAME" || { echo "Could not read app versionName"; exit 1; }
          RELEASE_APK="app/build/outputs/apk/release/kuro-v${VERSION_NAME}-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/kuro-v${VERSION_NAME}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RELEASE_APK"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEBUG_APK"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "release_path=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "debug_path=$DEBUG_APK" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.apk.outputs.version }}
          VERSION_NAME: ${{ steps.apk.outputs.version }}
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## Kuro v3.8.4 — LiriQo Rust Multi-Provider Lyrics Engine & Smooth Lyrics UI Animation

          - **Smooth Lyrics UI Animation & Elimination of Flickering**:
            - Repaired lyrics animation regression: restored smooth downward auto-scrolling with `FastOutSlowInEasing` and `animateScrollToItem`.
            - Fixed line dimming/flickering bug ("redup cerah"): phrasing gaps (1–3s) between lines no longer deactivate the active line; line remains active until next line begins.
            - Preserved true instrumental solo deactivation for extended interlude breaks (> 5000ms).
            - Added user scroll gesture interaction tracking (`collectIsDraggedAsState`) to pause auto-scrolling smoothly during manual touch gestures.
          - **LiriQo Rust Multi-Provider Lyrics Engine**:
            - Ported core backend of LiriQo (`AlFarrizi-Studio/Liriqo`) to native Rust (`kuro-core/src/liriqo.rs`) with JNI bridge in `KuroNativeCore`.
            - Direct studio-synchronized timestamps across 8 top-tier providers: Apple Music, Musixmatch, Unison, NetEase, KuGou Legato, QQ Portato, LRCLIB, and YouTube Music.
            - Dynamic provider quality ranking prioritizing studio syllable/word synchronization.
            - Integrated junk metadata and watermark filtering.
            - Dual query fallback: primary query by video ID (`?v={videoId}`), fallback by song title, artist, and duration.
          - **Disk Cache Upgrade**:
            - Upgraded lyrics disk cache to `lyrics_cache_v7` with automatic purging of older cache versions (`v4`, `v5`, `v6`).
            - Added `lyrics_cache_v7` support across Settings cache size calculation and cache clearing routines.
          - **Codebase Hygiene**:
            - Enforced strict zero single-line `//` and `///` comments across the entire project.
          - Published signed release and debug APKs.
          EOF
          gh release create "$RELEASE_TAG" \
            "${{ steps.apk.outputs.release_path }}" \
            "${{ steps.apk.outputs.debug_path }}" \
            --title "Kuro $RELEASE_TAG (LiriQo Rust Engine & Smooth Lyrics Animation)" \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuro-${{ steps.apk.outputs.version }}-APKs
          path: |
            ${{ steps.apk.outputs.release_path }}
            ${{ steps.apk.outputs.debug_path }}
          retention-days: 30

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f app/release.keystore
