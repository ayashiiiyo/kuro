name: Build and Release Kuro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed Kuro Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      KURO_KEYSTORE_BASE64: ${{ secrets.KURO_KEYSTORE_BASE64 }}
      KURO_STORE_PASSWORD: ${{ secrets.KURO_STORE_PASSWORD }}
      KURO_KEY_ALIAS: ${{ secrets.KURO_KEY_ALIAS }}
      KURO_KEY_PASSWORD: ${{ secrets.KURO_KEY_PASSWORD }}
      KURO_KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Validate signing secrets and decode keystore
        run: |
          test -n "$KURO_KEYSTORE_BASE64" || { echo "Missing KURO_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KURO_STORE_PASSWORD" || { echo "Missing KURO_STORE_PASSWORD secret"; exit 1; }
          test -n "$KURO_KEY_ALIAS" || { echo "Missing KURO_KEY_ALIAS secret"; exit 1; }
          test -n "$KURO_KEY_PASSWORD" || { echo "Missing KURO_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$KURO_KEYSTORE_BASE64" | base64 --decode > "$KURO_KEYSTORE_FILE"
          test -s "$KURO_KEYSTORE_FILE"

      - name: Set up Rust Toolchain and Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Kuro Native Core (Rust)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cargo ndk -t arm64-v8a -t armeabi-v7a -o app/src/main/jniLibs build --release --manifest-path kuro-core/Cargo.toml

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace || (echo "=== GRADLE BUILD FAILED ===" && exit 1)

      - name: Name APKs with app version
        id: apk
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION_NAME" || { echo "Could not read app versionName"; exit 1; }
          RELEASE_DIR="app/build/outputs/apk/release"
          DEBUG_DIR="app/build/outputs/apk/debug"
          RELEASE_APK="${RELEASE_DIR}/kuro-v${VERSION_NAME}-release.apk"
          ARM64_APK="${RELEASE_DIR}/kuro-v${VERSION_NAME}-arm64-v8a.apk"
          ARM32_APK="${RELEASE_DIR}/kuro-v${VERSION_NAME}-armeabi-v7a.apk"
          DEBUG_APK="${DEBUG_DIR}/kuro-v${VERSION_NAME}-debug.apk"
          if [ -f "${RELEASE_DIR}/app-universal-release.apk" ]; then
            cp "${RELEASE_DIR}/app-universal-release.apk" "$RELEASE_APK"
          else
            cp "${RELEASE_DIR}/app-release.apk" "$RELEASE_APK"
          fi
          if [ -f "${RELEASE_DIR}/app-arm64-v8a-release.apk" ]; then
            cp "${RELEASE_DIR}/app-arm64-v8a-release.apk" "$ARM64_APK"
          else
            cp "$RELEASE_APK" "$ARM64_APK"
          fi
          if [ -f "${RELEASE_DIR}/app-armeabi-v7a-release.apk" ]; then
            cp "${RELEASE_DIR}/app-armeabi-v7a-release.apk" "$ARM32_APK"
          else
            cp "$RELEASE_APK" "$ARM32_APK"
          fi
          if [ -f "${DEBUG_DIR}/app-universal-debug.apk" ]; then
            cp "${DEBUG_DIR}/app-universal-debug.apk" "$DEBUG_APK"
          else
            cp "${DEBUG_DIR}/app-debug.apk" "$DEBUG_APK"
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "release_path=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "arm64_path=$ARM64_APK" >> "$GITHUB_OUTPUT"
          echo "arm32_path=$ARM32_APK" >> "$GITHUB_OUTPUT"
          echo "debug_path=$DEBUG_APK" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.apk.outputs.version }}
          VERSION_NAME: ${{ steps.apk.outputs.version }}
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## Kuro v3.8.15 — Pure YouTube Music Engine, Audio Sub-Qualities & Cascade Motion Blur

          - **100% Pure YouTube Music Radio & Search Engine**:
            - Delegated Automix Radio (`RDAMVM`) sequence directly to YouTube Music AI with normalized title deduplication and negative skip penalty.
            - Prioritized Official Songs (`YTM_PARAMS_SONGS`) at the top of search results and switched search autocomplete to native YouTube Music suggestions (`/youtubei/v1/music/get_search_suggestions`).
            - Playing a track from Search now immediately launches YouTube Music Automix Radio instead of queueing duplicate search results.
          - **Expandable Audio Sub-Qualities (Codec & Bitrate Selector)**:
            - Added selectable sub-qualities under High (`WebM Opus ~160 kbps`, `M4A AAC 128-256 kbps`), Normal (`M4A 128 kbps`, `Opus ~128 kbps`), and Data Saver (`Opus 70 kbps`, `Opus 50 kbps`, `HE-AAC 48 kbps`).
          - **Cascade + Quantized Motion Blur (32-bit Android Go & 64-bit)**:
            - Added zero-recomposition RenderNode staggered cascade transition from Home to Search and pre-cached quantized blur steps.
          - **Rust `kuro-core` Packed JNI & Bug Fixes**:
            - Added zero-JSON-reparse packed JNI transport, isolated Search recents from Home history, and synced logged-in playback history to YouTube Music.
          EOF
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" \
            "${{ steps.apk.outputs.release_path }}" \
            "${{ steps.apk.outputs.arm64_path }}" \
            "${{ steps.apk.outputs.arm32_path }}" \
            "${{ steps.apk.outputs.debug_path }}" \
            --title "Kuro $RELEASE_TAG (Pure YT Music Engine, Audio Sub-Qualities & Cascade Motion Blur)" \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuro-${{ steps.apk.outputs.version }}-APKs
          path: |
            ${{ steps.apk.outputs.release_path }}
            ${{ steps.apk.outputs.arm64_path }}
            ${{ steps.apk.outputs.arm32_path }}
            ${{ steps.apk.outputs.debug_path }}
          retention-days: 30

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f app/release.keystore
